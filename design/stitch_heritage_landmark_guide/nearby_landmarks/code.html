<p class="font-caption text-caption text-on-surface-variant truncate">Iconic ancient Roman amphitheater.</p>
</div>
<div class="ml-2 flex flex-col items-end flex-shrink-0">
<span class="font-label-caps text-label-caps text-secondary mb-1">2.1 KM</span>
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant group-hover:text-primary-container group-hover:bg-primary-container/10 transition-colors">

</div>

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">explore</span>

<button aria-label="settings" class="flex flex-col items-center justify-center text-on-surface-variant w-12 h-12 hover:text-primary transition-all">
