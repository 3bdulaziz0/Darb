<!DOCTYPE html>

                    "spacing": {

                        "touch-target-min": "44px",
                        "stack-md": "24px",
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "margin-mobile": "20px",
                        "stack-lg": "48px"
                    },
                    "fontFamily": {
                        "body-lg": ["Manrope"],
                        "display-lg-mobile": ["Manrope"],

                }
            }

<style>
        .glass-panel {
            background-color: rgba(26, 26, 34, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .ghost-border {
            border: 1px solid rgba(160, 160, 174, 0.2);
        }
        /* Hide scrollbar for clean aesthetic */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md h-screen w-screen overflow-hidden relative selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Camera Feed -->
<div class="absolute inset-0 z-0">
<img alt="" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAynzXWll3HQAi0t9DYcXhqHfqAkPgxwUpsjkFHzrjgfq6SnKP2w5j1w0Yvdz-iJhVHLEvWsRamO4djfUPRiZfstw02SXPaLTwp8EV4w2nXdu3gNil8CTNWrbEVIkz7Izz504bEROgAD90C6zAkgJ5zbK0xon8KTx37wR-Jk4SfjfpUiMIdrVGd0Ygpq2Aka7l2CtQ61THkmJruZpmLPednZCT5V4l0ebnUrQmIJS1tnraITrZBdCa2"/>
<!-- Optional subtle gradient overlay for text legibility if needed, but keeping it minimal as requested -->
<div class="absolute inset-0 bg-gradient-to-b from-surface/20 via-transparent to-surface/40 pointer-events-none"></div>
</div>
<!-- Top Navigation / Status Area -->
<div class="absolute top-0 left-0 w-full z-10 flex justify-between items-start pt-margin-mobile px-margin-mobile">
<!-- Location Pill -->
<div class="glass-panel ghost-border rounded-full flex items-center px-4 h-10 shadow-none">
<span class="material-symbols-outlined text-[18px] mr-2 text-on-surface" style="font-variation-settings: 'FILL' 0;">location_on</span>
<span class="font-label-caps text-label-caps text-on-surface uppercase tracking-widest">District Landmark</span>
</div>
<!-- Language Toggle -->
<button aria-label="Toggle Language" class="glass-panel ghost-border rounded-full flex items-center justify-center w-touch-target-min h-touch-target-min shadow-none hover:bg-surface-variant transition-colors">
<span class="font-label-caps text-label-caps text-on-surface">EN</span>
</button>
</div>
<!-- Center Framing Guide -->
<div class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none">
<!-- Bracket Frame -->
<div class="relative w-64 h-64 md:w-80 md:h-80 opacity-70">
<!-- Top Left -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-2 border-l-2 border-on-surface"></div>
<!-- Top Right -->
<div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-on-surface"></div>
<!-- Bottom Left -->
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-on-surface"></div>
<!-- Bottom Right -->
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-2 border-r-2 border-on-surface"></div>
</div>
<!-- Helper Text -->
<p class="mt-stack-md font-body-md text-body-md text-on-surface opacity-80 shadow-none text-center px-4 py-2 glass-panel rounded-lg ghost-border">
            Point at a landmark
        </p>
</div>
<!-- Bottom Action Area -->
<div class="absolute bottom-0 left-0 w-full z-20 pb-margin-mobile px-margin-mobile flex justify-between items-center bg-gradient-to-t from-surface/60 to-transparent pt-12">
<!-- Discover Nearby Button -->
<button aria-label="Discover nearby" class="glass-panel ghost-border rounded-full flex items-center justify-center w-touch-target-min h-touch-target-min shadow-none hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 0;">map</span>
</button>
<!-- Main Capture Button -->
<button aria-label="Analyze Landmark" class="relative flex items-center justify-center w-20 h-20 rounded-full border-4 border-on-surface hover:scale-95 transition-transform group">
<div class="absolute inset-2 rounded-full bg-primary-container transition-transform group-hover:scale-90"></div>
</button>
<!-- Settings Button -->
<button aria-label="Settings" class="glass-panel ghost-border rounded-full flex items-center justify-center w-touch-target-min h-touch-target-min shadow-none hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</div>
</body></html>
