<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>Settings Sheet</title>

                    "surface-bright": "#39393d",

                    "error": "#ffb4ab",
                    "inverse-on-surface": "#303034",

                    "on-secondary": "#3e2e0c",
                    "primary-container": "#6c4bf4",

                    "on-primary-fixed-variant": "#4612cf",
                    "on-error-container": "#ffdad6",
                    "secondary-fixed": "#fcdfaf",

            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"

            "spacing": {
                    "touch-target-min": "44px",
                    "stack-md": "24px",
                    "stack-lg": "48px",
                    "margin-mobile": "20px",
                    "gutter": "16px",
                    "stack-sm": "8px",
                    "margin-desktop": "64px"
            },
            "fontFamily": {
                    "body-lg": [
                            "Manrope"
                    ],
                    "label-caps": [
                            "Space Grotesk"
                    ],
                    "headline-md": [

                    ],
                    "caption": [
                            "Manrope"
                    ],
                    "display-lg": [
                            "Manrope"
                    ],
                    "display-lg-mobile": [

                    ],
                    "body-md": [

                    ]
            },
            "fontSize": {
                    "body-lg": [

                    "headline-md": [

                    "display-lg": [

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest h-screen w-full relative overflow-hidden font-body-lg text-body-lg text-on-surface">
<!-- Simulated Viewfinder Background -->
<div class="absolute inset-0 z-0">
<div class="w-full h-full bg-cover bg-center object-cover grayscale opacity-40" data-alt="A slightly blurred, cinematic view of an ancient temple ruin at twilight, bathed in soft, moody indigo and deep violet light. The architecture is grand but weathered, creating a sense of history and mystery. The scene is shot with a shallow depth of field, rendering the background soft and ethereal, suitable for a dark-mode camera viewfinder background." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB7jSuF46m44y2kRMcfLKEcJmIqyLdO4kqlOvJ6_JeJXduy_ei6vIH8Xq7FTD2mv9FpyckQgh3_phtBqyBvOijQDnRmIhWfe-1HLHAyuet0n75JC5g2L8hnp2QSb5Z0-z5imVQmwgiyscCUJsWNqZCaeEg4uIAt9kZpMEienmIEwE1REqZ22yq9ZIzaww97IkZ0aYSl6sMVrSxyzGtAzoC_cEmmooQui9FHIBRSNHdu8oKrJ3ctcb4d')"></div>
</div>
<!-- Dimmer Overlay -->
<div class="absolute inset-0 bg-surface-container-lowest/70 backdrop-blur-sm z-10 transition-opacity"></div>
<!-- Bottom Sheet Container -->
<div class="absolute bottom-0 left-0 w-full z-20 flex flex-col justify-end h-full">
<div class="bg-surface-container rounded-t-[20px] w-full max-w-2xl mx-auto shadow-[0_-8px_32px_rgba(0,0,0,0.5)] border-t border-outline-variant/20 backdrop-blur-xl flex flex-col pb-8 pt-4 px-margin-mobile transition-transform duration-300 translate-y-0 relative">
<!-- Drag Handle -->
<div class="w-12 h-1 bg-outline-variant/50 rounded-full mx-auto mb-6"></div>
<!-- Title -->
<h2 class="font-headline-md text-headline-md text-on-surface mb-stack-md">Settings</h2>
<!-- Language Row -->
<div class="flex items-center justify-between py-4 border-b border-outline-variant/20 min-h-[64px]">
<span class="font-body-md text-body-md text-on-surface">Language</span>
<div class="flex bg-surface-container-high rounded-full p-1 border border-outline-variant/30">
<button class="px-4 py-2 min-h-touch-target-min min-w-touch-target-min rounded-full font-label-caps text-label-caps text-on-surface-variant transition-colors hover:text-on-surface">العربية</button>
<button class="px-4 py-2 min-h-touch-target-min min-w-touch-target-min rounded-full bg-primary-container text-on-primary-container font-label-caps text-label-caps shadow-sm">English</button>
</div>
</div>
<!-- Narration Voice Label -->
<div class="py-4 mt-2">
<span class="font-body-md text-body-md text-on-surface-variant block mb-4">Narration voice</span>
<!-- Voice Options List -->
<div class="flex flex-col gap-2">
<!-- Option 1: Selected -->
<button class="flex items-center justify-between p-3 rounded-lg border border-primary-container bg-primary-container/10 transition-colors min-h-touch-target-min group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0 text-on-surface group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="play_arrow">play_arrow</span>
</div>
<div class="flex flex-col items-start">
<span class="font-body-md text-body-md text-on-surface font-semibold">Layla</span>
</div>
<span class="px-2 py-0.5 rounded text-[10px] font-label-caps bg-surface-container-highest text-on-surface-variant uppercase tracking-wider ml-2">AR</span>
</div>
<span class="material-symbols-outlined text-primary-container" data-icon="check">check</span>
</button>
<!-- Option 2 -->
<button class="flex items-center justify-between p-3 rounded-lg border border-transparent hover:border-outline-variant/30 transition-colors min-h-touch-target-min group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0 text-on-surface-variant group-hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" data-icon="play_arrow">play_arrow</span>
</div>
<div class="flex flex-col items-start">
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Omar</span>
</div>
<span class="px-2 py-0.5 rounded text-[10px] font-label-caps bg-surface-container-highest text-on-surface-variant uppercase tracking-wider ml-2">AR</span>
</div>
</button>
<!-- Option 3 -->
<button class="flex items-center justify-between p-3 rounded-lg border border-transparent hover:border-outline-variant/30 transition-colors min-h-touch-target-min group">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0 text-on-surface-variant group-hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" data-icon="play_arrow">play_arrow</span>
</div>
<div class="flex flex-col items-start">
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Sarah</span>
</div>
<span class="px-2 py-0.5 rounded text-[10px] font-label-caps bg-surface-container-highest text-on-surface-variant uppercase tracking-wider ml-2">EN</span>
</div>
</button>
</div>
</div>
<!-- Reading Speed Row -->
<div class="py-4 border-b border-outline-variant/20 mt-4">
<span class="font-body-md text-body-md text-on-surface block mb-6">Reading speed</span>
<div class="relative w-full h-1 bg-surface-container-highest rounded-full mb-8">
<!-- Slider Track Fill -->
<div class="absolute left-0 top-0 h-full bg-primary-container rounded-full w-1/2"></div>
<!-- Slider Thumb -->
<div class="absolute left-1/2 top-1/2 -translate-y-1/2 -translate-x-1/2 w-6 h-6 bg-primary-container rounded-full shadow-[0_0_10px_rgba(108,75,244,0.5)] border-2 border-surface-container flex items-center justify-center cursor-pointer hover:scale-110 transition-transform"></div>
<!-- Labels -->
<div class="absolute w-full top-6 flex justify-between font-caption text-caption text-outline">
<span>Slow</span>
<span>Normal</span>
<span>Fast</span>
</div>
</div>
<!-- Extra space for absolute labels -->
<div class="h-6"></div>
</div>
<!-- Permissions Link Row -->
<button class="w-full flex items-center justify-between py-6 min-h-[64px] group mt-2 text-left">
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">Camera and location permissions</span>
<span class="material-symbols-outlined text-outline group-hover:text-on-surface transition-colors" data-icon="chevron_right">chevron_right</span>
</button>
</div>
</div>
</body></html>
