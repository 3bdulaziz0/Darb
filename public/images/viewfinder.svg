<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 860" width="430" height="860" role="img" aria-label="Camera viewfinder placeholder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2A38"/>
      <stop offset="1" stop-color="#151520"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A4A38"/>
      <stop offset="1" stop-color="#332A20"/>
    </linearGradient>
  </defs>
  <rect width="430" height="860" fill="url(#sky)"/>
  <!-- ground -->
  <rect y="700" width="430" height="160" fill="#1B1B22"/>
  <!-- facade -->
  <rect x="70" y="180" width="290" height="520" fill="url(#stone)"/>
  <rect x="70" y="180" width="290" height="520" fill="none" stroke="#E4C89A" stroke-opacity="0.12"/>
  <!-- arched doorway -->
  <path d="M180 700 V520 a35 35 0 0 1 70 0 V700 Z" fill="#12121A"/>
  <!-- roshan (projecting timber bay) -->
  <rect x="150" y="380" width="130" height="90" fill="#3E3226" stroke="#E4C89A" stroke-opacity="0.18"/>
  <g stroke="#E4C89A" stroke-opacity="0.14">
    <path d="M160 380v90M180 380v90M200 380v90M220 380v90M240 380v90M260 380v90"/>
  </g>
  <!-- windows -->
  <g fill="#12121A">
    <rect x="100" y="250" width="40" height="70" rx="18"/>
    <rect x="290" y="250" width="40" height="70" rx="18"/>
    <rect x="100" y="520" width="40" height="70" rx="18"/>
    <rect x="290" y="520" width="40" height="70" rx="18"/>
  </g>
  <text x="215" y="800" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="2" fill="#A0A0AE" fill-opacity="0.55">CAMERA PLACEHOLDER</text>
</svg>
